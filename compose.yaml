services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: db
    volumes:
      - ./content:/app/content
    depends_on:
      - db

  frontend:
    image: thomaslaforge/shortcuts-front
    environment:
      API_PROXY_TARGET: http://api:5000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  db_data:
